{% extends "base.html" %} {% block content %}
<div style="text-align:center; padding: 80px 20px;">
    <div style="font-size:5rem; font-weight:700; color:#e5e7eb; line-height:1">
        {{ code or 404 }}
    </div>
    <h4 class="mt-2 mb-2 fw-500">
        {% if code == 500 %} Something went wrong {% else %} Page not found {% endif %}
    </h4>
    <p class="text-muted mb-4" style="font-size:.95rem">
        {% if message %} {{ message }} {% else %} The page you're looking for doesn't exist or has been moved. {% endif %}
    </p>
    <a href="/" class="btn btn-dark px-4">Go to dashboard</a>
</div>
{% endblock %}
