{% extends "base.html" %}
{% block content %}

<div class="d-flex align-items-center gap-3 mb-4">
  <a href="/dashboard" class="btn btn-outline-secondary btn-sm">← Back</a>
  <h4 class="mb-0 fw-700">Change Password</h4>
</div>

<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body px-4 py-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label small fw-500">Current password</label>
            <input type="password" name="current_password" class="form-control" required/>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-500">New password</label>
            <input type="password" name="new_password" class="form-control"
                   placeholder="Min. 6 characters" required/>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-500">Confirm new password</label>
            <input type="password" name="confirm_password" class="form-control" required/>
          </div>
          <button type="submit" class="btn btn-dark w-100">Update password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
