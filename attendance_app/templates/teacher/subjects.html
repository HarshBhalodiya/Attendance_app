{% extends "base.html" %} {% block content %}

<div class="d-flex align-items-center justify-content-between mb-4">
    <div>
        <h4 class="mb-0 fw-700">Subjects</h4>
        <span class="text-muted small">Manage subjects taught in your class</span>
    </div>
</div>

<div class="card mb-4">
    <div class="card-header px-4 py-3">Add new subject</div>
    <div class="card-body px-4">
        <form method="POST" class="row g-3">
            <div class="col-sm-8">
                <input type="text" name="name" placeholder="Subject name (e.g. Mathematics)" class="form-control" required/>
            </div>
            <div class="col-sm-4">
                <button type="submit" class="btn btn-dark w-100">Add subject</button>
            </div>
        </form>
    </div>
</div>

<div class="card">
    <div class="card-header px-4 py-3">All subjects ({{ subjects | length }})</div>
    <ul class="list-group list-group-flush">
        {% for s in subjects %}
        <li class="list-group-item px-4 py-3 d-flex justify-content-between align-items-center">
            <span class="fw-500">{{ s.name }}</span>
            <div class="d-flex align-items-center gap-2">
              <span class="badge bg-secondary rounded-pill">ID: {{ s.id }}</span>
              <form method="POST" action="/subjects/delete/{{ s.id }}"
                    onsubmit="return confirm('Delete {{ s.name }}? All attendance records for this subject will also be removed.')">
                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
              </form>
            </div>
        </li>
        {% else %}
        <li class="list-group-item px-4 py-3 text-muted text-center">
            No subjects yet. Add one above.
        </li>
        {% endfor %}
    </ul>
</div>

{% endblock %}
